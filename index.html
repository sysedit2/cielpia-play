<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIELPIA Partner | 아이의 성장을 디자인하는 프리미엄 교육 솔루션</title>
<meta name="description" content="CIELPIA는 유아의 잠재력을 발견하고 미래를 준비하는 통합 교육 프로그램을 제공합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --navy:#1c2b4a;
    --teal:#0fa3b1;
    --gray-600:#6b7684;
    --gray-400:#9aa3b0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Gowun Dodum','Nunito','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color:var(--navy);
    background:#fff;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img,svg{display:block; max-width:100%;}
  a{text-decoration:none; color:inherit;}
  .wrap{max-width:1400px; margin:0 auto; padding:0 48px;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    background-image:url('hero-bg.jpg');
    background-size:cover;
    background-position:center bottom;
    background-color:#eef6fb;
    overflow:hidden;
  }
  .hero-inner{
    position:relative;
    display:grid;
    grid-template-columns:1.1fr 1fr;
    align-items:center;
    min-height:420px;
    z-index:3;
  }
  .hero-copy{padding:64px 0 40px;}
  .eyebrow{
    font-family:'Pretendard',sans-serif;
    font-size:clamp(19px,2.2vw,27px);
    font-weight:600;
    color:var(--navy);
    margin-bottom:8px;
    letter-spacing:-0.4px;
  }
  .headline{
    font-family:'Pretendard',sans-serif;
    font-size:clamp(28px,3.6vw,42px);
    font-weight:800;
    color:var(--teal);
    line-height:1.35;
    margin-bottom:22px;
    letter-spacing:-0.5px;
  }
  .sub{
    font-family:'Gowun Dodum',sans-serif;
    font-size:clamp(15.5px,1.3vw,18.5px);
    color:var(--gray-600);
    line-height:1.85;
    font-weight:400;
  }
  .brand-inline{
    display:inline-block;
    height:1.75em;
    width:auto;
    vertical-align:-0.151em;
    margin-right:.04em;
  }

  .hero-scene{
    position:relative;
    height:380px;
  }
  .mascots{
    position:absolute;
    right:6%; bottom:22px;
    width:290px;
    height:auto;
    z-index:4;
    filter:drop-shadow(0 16px 18px rgba(30,60,40,.22));
  }

  /* ---------- PROGRAMS ---------- */
  .programs{
    padding:56px 0 96px;
    background:#fff;
  }
  .cards{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:22px;
  }
  .card-link{
    display:block;
    border-radius:20px;
    overflow:hidden;
    transition:transform .25s ease, filter .25s ease;
    filter:drop-shadow(0 4px 14px rgba(20,40,70,.10));
  }
  .card-link:hover{transform:translateY(-6px); filter:drop-shadow(0 12px 24px rgba(20,40,70,.16));}
  .card-link img{
    display:block;
    width:100%;
    aspect-ratio:560/830;
    object-fit:cover;
  }

  footer{
    padding:28px 0 40px;
    text-align:center;
    color:var(--gray-400);
    font-size:12.5px;
    font-weight:700;
  }

  @media (max-width:1080px){
    .cards{grid-template-columns:repeat(3,1fr);}
    .hero-inner{grid-template-columns:1fr;}
    .hero-scene{height:280px; margin-top:6px;}
    .mascots{width:220px; right:2%; bottom:20px;}
  }
  @media (max-width:640px){
    .wrap{padding:0 22px;}
    .cards{grid-template-columns:repeat(2,1fr);}
    .hero-copy{padding:36px 0 12px;}
    .hero-scene{height:220px;}
    .mascots{width:160px;}
  }
</style>
</head>
<body>

<section class="hero">
  <div class="wrap hero-inner">
    <div class="hero-copy">
      <div class="eyebrow">아이의 성장을 디자인하는</div>
      <div class="headline">프리미엄 교육 솔루션</div>
      <p class="sub">
        <img class="brand-inline" src="cielpia-logo.webp" alt="CIELPIA" width="440" height="116">는 유아의 잠재력을 발견하고<br>
        미래를 준비하는 통합 교육 프로그램을 제공합니다.
      </p>
    </div>
    <div class="hero-scene">
      <img class="mascots" src="mascots.webp" alt="모모와 테리 캐릭터" width="600" height="721">
    </div>
  </div>
</section>

<section class="programs">
  <div class="wrap">
    <div class="cards">
      <a class="card-link"><img src="card-momo-terry.webp" alt="모모&테리 - 몬테소리 원리를 기반으로 한 만1세, 만2세 통합 교육 프로그램"></a>
      <a class="card-link"><img src="card-cielpia.webp" alt="씨엘피아 - 발달 단계에 맞춘 체계적인 몬테소리 통합 커리큘럼"></a>
      <a class="card-link"><img src="card-global-leader.webp" alt="글로벌리더 - 글로벌 역량을 키우는 영어 통합 학습 프로그램"></a>
      <a class="card-link"><img src="card-explorer.webp" alt="탐험가 프로그램 - 탐구와 경험을 통해 세상을 배우는 놀이 중심 탐험 프로그램"></a>
      <a class="card-link"><img src="card-yumyum.webp" alt="얌얌 - 건강한 식습관과 생활 습관을 위한 영양·건강 교육 프로그램"></a>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">© 2026 CIELPIA. All rights reserved.</div>
</footer>

</body>
</html>
