<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIELPIA Partner | 아이의 성장을 디자인하는 프리미엄 교육 솔루션</title>
<meta name="description" content="CIELPIA는 유아의 잠재력을 발견하고 미래를 준비하는 통합 교육 프로그램을 제공합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --navy:#1c2b4a;
    --teal:#0fa3b1;
    --gray-600:#6b7684;
    --gray-400:#9aa3b0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Gowun Dodum','Nunito','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color:var(--navy);
    background:#fff;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img,svg{display:block; max-width:100%;}
  a{text-decoration:none; color:inherit;}
  .wrap{max-width:1400px; margin:0 auto; padding:0 48px;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    background-image:url('hero-bg.jpg');
    background-size:cover;
    background-position:center bottom;
    background-color:#eef6fb;
    overflow:hidden;
  }
  .hero-inner{
    position:relative;
    display:grid;
    grid-template-columns:1.1fr 1fr;
    align-items:center;
    min-height:420px;
    z-index:3;
  }
  .hero-copy{padding:64px 0 40px;}
  .eyebrow{
    font-family:'Pretendard',sans-serif;
    font-size:clamp(19px,2.2vw,27px);
    font-weight:600;
    color:var(--navy);
    margin-bottom:8px;
    letter-spacing:-0.4px;
  }
  .headline{
    font-family:'Pretendard',sans-serif;
    font-size:clamp(28px,3.6vw,42px);
    font-weight:800;
    color:var(--teal);
    line-height:1.35;
    margin-bottom:22px;
    letter-spacing:-0.5px;
  }
  .sub{
    font-family:'Gowun Dodum',sans-serif;
    font-size:clamp(15.5px,1.3vw,18.5px);
    color:var(--gray-600);
    line-height:1.85;
    font-weight:400;
  }

  .hero-scene{
    position:relative;
    height:380px;
  }
  .mascots{
    position:absolute;
    right:4%; bottom:36px;
    width:300px;
    z-index:4;
    filter:drop-shadow(0 18px 20px rgba(30,60,40,.18));
  }

  /* ---------- PROGRAMS ---------- */
  .programs{
    padding:56px 0 96px;
    background:#fff;
  }
  .cards{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:22px;
  }
  .card-link{
    display:block;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 4px 18px rgba(20,40,70,.08);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .card-link:hover{transform:translateY(-6px); box-shadow:0 14px 28px rgba(20,40,70,.14);}
  .card-link img{width:100%; height:auto;}

  footer{
    padding:28px 0 40px;
    text-align:center;
    color:var(--gray-400);
    font-size:12.5px;
    font-weight:700;
  }

  @media (max-width:1080px){
    .cards{grid-template-columns:repeat(3,1fr);}
    .hero-inner{grid-template-columns:1fr;}
    .hero-scene{height:280px; margin-top:6px;}
    .mascots{width:220px; right:2%; bottom:20px;}
  }
  @media (max-width:640px){
    .wrap{padding:0 22px;}
    .cards{grid-template-columns:repeat(2,1fr);}
    .hero-copy{padding:36px 0 12px;}
    .hero-scene{height:220px;}
    .mascots{width:160px;}
  }
</style>
</head>
<body>

<section class="hero">
  <div class="wrap hero-inner">
    <div class="hero-copy">
      <div class="eyebrow">아이의 성장을 디자인하는</div>
      <div class="headline">프리미엄 교육 솔루션</div>
      <p class="sub">
        CIELPIA는 유아의 잠재력을 발견하고<br>
        미래를 준비하는 통합 교육 프로그램을 제공합니다.
      </p>
    </div>
    <div class="hero-scene">
      <svg class="mascots" viewBox="0 0 340 360" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="170" cy="345" rx="120" ry="12" fill="#2e5c3a" opacity=".12"/>
        <g>
          <path d="M95 150c0-30 24-54 50-54s50 24 50 76c0 44-26 78-56 78s-64-34-64-78c0-6 2-14 6-22z" fill="#8fd0f0"/>
          <path d="M100 150c-4-26 16-50 42-52-24 4-38 26-34 50" fill="#79c3e8" opacity=".6"/>
          <ellipse cx="150" cy="176" rx="9" ry="11" fill="#25313f"/>
          <ellipse cx="182" cy="176" rx="9" ry="11" fill="#25313f"/>
          <circle cx="147" cy="173" r="2.6" fill="#fff"/>
          <circle cx="179" cy="173" r="2.6" fill="#fff"/>
          <circle cx="132" cy="196" r="9" fill="#ffb3c0" opacity=".7"/>
          <circle cx="200" cy="196" r="9" fill="#ffb3c0" opacity=".7"/>
          <path d="M150 202q16 12 32 0" stroke="#25313f" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M88 220q-22 6-28 26" stroke="#8fd0f0" stroke-width="14" fill="none" stroke-linecap="round"/>
          <circle cx="58" cy="248" r="9" fill="#8fd0f0"/>
          <ellipse cx="120" cy="300" rx="18" ry="26" fill="#8fd0f0"/>
          <ellipse cx="178" cy="300" rx="18" ry="26" fill="#8fd0f0"/>
        </g>
        <g transform="translate(150,0)">
          <ellipse cx="150" cy="330" rx="34" ry="10" fill="#2e5c3a" opacity=".1"/>
          <rect x="112" y="210" width="76" height="110" rx="30" fill="#8fc86a"/>
          <rect x="112" y="230" width="76" height="90" rx="26" fill="#79b957"/>
          <circle cx="150" cy="140" r="62" fill="#c8e88a"/>
          <path d="M150 78q-6-26 8-40" stroke="#7fae3f" stroke-width="7" fill="none" stroke-linecap="round"/>
          <path d="M150 62q10-14 2-30" stroke="#7fae3f" stroke-width="6" fill="none" stroke-linecap="round"/>
          <ellipse cx="128" cy="140" rx="8" ry="10" fill="#25313f"/>
          <ellipse cx="172" cy="140" rx="8" ry="10" fill="#25313f"/>
          <circle cx="125" cy="137" r="2.4" fill="#fff"/>
          <circle cx="169" cy="137" r="2.4" fill="#fff"/>
          <circle cx="112" cy="158" r="9" fill="#ffb3c0" opacity=".7"/>
          <circle cx="188" cy="158" r="9" fill="#ffb3c0" opacity=".7"/>
          <path d="M132 162q18 14 36 0" stroke="#25313f" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M112 245q-26 4-34 24" stroke="#8fc86a" stroke-width="15" fill="none" stroke-linecap="round"/>
          <circle cx="76" cy="270" r="10" fill="#8fc86a"/>
          <ellipse cx="128" cy="322" rx="19" ry="9" fill="#5b8a3a"/>
          <ellipse cx="172" cy="322" rx="19" ry="9" fill="#5b8a3a"/>
          <circle cx="126" cy="238" r="4" fill="#5b8a3a"/>
          <circle cx="174" cy="238" r="4" fill="#5b8a3a"/>
        </g>
      </svg>
    </div>
  </div>
</section>

<section class="programs">
  <div class="wrap">
    <div class="cards">
      <a class="card-link"><img src="card-momo-terry.jpg" alt="모모&테리 - 몬테소리 원리를 기반으로 한 만1세, 만2세 통합 교육 프로그램" width="182" height="272"></a>
      <a class="card-link"><img src="card-cielpia.jpg" alt="씨엘피아 - 발달 단계에 맞춘 체계적인 몬테소리 통합 커리큘럼" width="184" height="272"></a>
      <a class="card-link"><img src="card-global-leader.jpg" alt="글로벌리더 - 글로벌 역량을 키우는 영어 통합 학습 프로그램" width="183" height="272"></a>
      <a class="card-link"><img src="card-explorer.jpg" alt="탐험가 프로그램 - 탐구와 경험을 통해 세상을 배우는 놀이 중심 탐험 프로그램" width="183" height="272"></a>
      <a class="card-link"><img src="card-yumyum.jpg" alt="얌얌 - 건강한 식습관과 생활 습관을 위한 영양·건강 교육 프로그램" width="191" height="272"></a>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">© 2026 CIELPIA. All rights reserved.</div>
</footer>

</body>
</html>
